name: Create Release (custom)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag (leer = aus repoVersion ermitteln)
        required: false
        default: ''
      name:
        description: Release-Name (leer = "Release {tag}")
        required: false
        default: ''
      releaseType:
        description: Release-Typ
        type: choice
        options:
          - Release
          - Prerelease
          - Draft
        default: Release
      updateVersionNumber:
        description: Neue Version in main nach Release (z.B. +0.1)
        required: false
        default: '+0.1'
      createReleaseBranch:
        description: Release-Branch anlegen?
        type: boolean
        default: false
      directCommit:
        description: Direkt committen?
        type: boolean
        default: true
      useGhTokenWorkflow:
        description: GhTokenWorkflow für PR/Commit verwenden?
        type: boolean
        default: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Token aus GitHub App generieren
        id: app-token
        uses: ./.github/actions/generate-app-token
        with:
          token-secret: ${{ secrets.GHTOKENWORKFLOW }}
          actions-permission: write

      - name: Versions-Tag ermitteln
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'.Trim()
          if (-not $tag) {
            if (-not (Test-Path '.AL-Go/settings.json')) {
              Write-Error 'Missing .AL-Go/settings.json'; exit 1
            }
            $settings = Get-Content '.AL-Go/settings.json' -Raw | ConvertFrom-Json
            $repoVersion = [string]$settings.repoVersion
            if ($repoVersion -notmatch '^\d+(\.\d+){1,3}$') {
              Write-Error "Invalid or missing repoVersion in .AL-Go/settings.json: '$repoVersion'"; exit 1
            }
            $versionParts = $repoVersion.Split('.')
            while ($versionParts.Count -lt 3) { $versionParts += '0' }
            $tag = ($versionParts | Select-Object -First 3) -join '.'
          }
          $releaseName = '${{ inputs.name }}'.Trim()
          if (-not $releaseName) { $releaseName = "Release $tag" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$releaseName"

      - name: Release erstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run "CreateRelease.yaml" `
            --ref main `
            --field "releaseType=${{ inputs.releaseType }}" `
            --field "tag=${{ steps.version.outputs.tag }}" `
            --field "name=${{ steps.version.outputs.name }}" `
            --field "updateVersionNumber=${{ inputs.updateVersionNumber }}" `
            --field "createReleaseBranch=${{ inputs.createReleaseBranch }}" `
            --field "directCommit=${{ inputs.directCommit }}" `
            --field "useGhTokenWorkflow=${{ inputs.useGhTokenWorkflow }}" `
            --repo ${{ github.repository }}
